<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraFlow 3D — Cyber Routine Matrix</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons & Canvas Libraries -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Canvas Three.js Background -->
  <canvas id="webgl-bg"></canvas>
  <div class="glow-overlay"></div>

  <div class="app-layout">
    
    <!-- Topbar Cyber Header -->
    <header class="cyber-header">
      <div class="brand-zone">
        <div class="cyber-logo">
          <i data-lucide="zap"></i>
        </div>
        <div>
          <h1 class="brand-title">AURA<span>FLOW</span></h1>
          <p class="brand-sub">Sistema de Alta Performance &amp; Rotina</p>
        </div>
      </div>

      <div class="user-chip">
        <div class="user-avatar">
          <i data-lucide="shield-check"></i>
        </div>
        <div class="user-meta">
          <span class="u-name">Auxiliar Administrativo</span>
          <span class="u-org">COAGRU &bull; Operações</span>
        </div>
      </div>

      <div class="clock-badge" id="liveClock">00:00:00</div>
    </header>

    <!-- Stats Bar -->
    <section class="stats-bar">
      <div class="stat-card">
        <i data-lucide="target" class="stat-icon p-color"></i>
        <div>
          <span class="stat-val" id="completedCount">0/7</span>
          <span class="stat-lbl">Blocos Concluídos</span>
        </div>
      </div>
      <div class="stat-card">
        <i data-lucide="activity" class="stat-icon s-color"></i>
        <div>
          <span class="stat-val" id="progressPercent">0%</span>
          <span class="stat-lbl">Progresso Diário</span>
        </div>
      </div>
      <div class="stat-card">
        <i data-lucide="flame" class="stat-icon t-color"></i>
        <div>
          <span class="stat-val">14 Dias</span>
          <span class="stat-lbl">Ofensiva Atual</span>
        </div>
      </div>
    </section>

    <!-- Category Filter Bar -->
    <nav class="filter-bar">
      <button class="f-btn active" data-cat="all"><i data-lucide="grid"></i> Todas</button>
      <button class="f-btn" data-cat="trabalho"><i data-lucide="building-2"></i> Coagru (Trabalho)</button>
      <button class="f-btn" data-cat="esportes"><i data-lucide="trophy"></i> Esportes</button>
      <button class="f-btn" data-cat="saude"><i data-lucide="heart-pulse"></i> Saúde</button>
      <button class="f-btn" data-cat="estudo"><i data-lucide="code-2"></i> Estudos</button>
      <button class="f-btn" data-cat="hobby"><i data-lucide="gamepad-2"></i> Hobbies</button>
      <button class="f-btn" data-cat="lazer"><i data-lucide="sparkles"></i> Lazer</button>
    </nav>

    <!-- Matrix Cards Grid -->
    <main class="cards-grid" id="cardsGrid">
      <!-- Cards serão gerados via JS -->
    </main>
  </div>

  <!-- Modal Interativo -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-box" id="modalBox">
      <button class="modal-close-btn" id="closeModalBtn"><i data-lucide="x"></i></button>

      <div class="modal-top">
        <span class="modal-tag" id="mTag">CATEGORIA</span>
        <h2 class="modal-title" id="mTitle">Título do Bloco</h2>
        <div class="modal-time"><i data-lucide="clock"></i> <span id="mTime">00:00 - 00:00</span></div>
      </div>

      <div class="modal-content
