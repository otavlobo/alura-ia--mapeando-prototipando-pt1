<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraFlow 3D — Cyber Routine Matrix</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons & Canvas Libraries -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Canvas Three.js Background -->
  <canvas id="webgl-bg"></canvas>
  <div class="glow-overlay"></div>

  <div class="app-layout">
    
    <!-- Topbar Cyber Header -->
    <header class="cyber-header">
      <div class="brand-zone">
        <div class="cyber-logo">
          <i data-lucide="zap"></i>
        </div>
        <div>
          <h1 class="brand-title">AURA<span>FLOW</span></h1>
          <p class="brand-sub">Sistema de Alta Performance &amp; Rotina</p>
        </div>
      </div>

      <div class="user-chip">
        <div class="user-avatar">
          <i data-lucide="shield-check"></i>
        </div>
        <div class="user-meta">
          <span class="u-name">Auxiliar Administrativo</span>
          <span class="u-org">COAGRU &bull; Operações</span>
        </div>
      </div>

      <div class="clock-badge" id="liveClock">00:00:00</div>
    </header>

    <!-- Stats Bar -->
    <section class="stats-bar">
      <div class="stat-card">
        <i data-lucide="target" class="stat-icon p-color"></i>
        <div>
          <span class="stat-val" id="completedCount">0/7</span>
          <span class="stat-lbl">Blocos Concluídos</span>
        </div>
      </div>
      <div class="stat-card">
        <i data-lucide="activity" class="stat-icon s-color"></i>
        <div>
          <span class="stat-val" id="progressPercent">0%</span>
          <span class="stat-lbl">Progresso Diário</span>
        </div>
      </div>
      <div class="stat-card">
        <i data-lucide="flame" class="stat-icon t-color"></i>
        <div>
          <span class="stat-val">14 Dias</span>
          <span class="stat-lbl">Ofensiva Atual</span>
        </div>
      </div>
    </section>

    <!-- Category Filter Bar -->
    <nav class="filter-bar">
      <button class="f-btn active" data-cat="all"><i data-lucide="grid"></i> Todas</button>
      <button class="f-btn" data-cat="trabalho"><i data-lucide="building-2"></i> Coagru (Trabalho)</button>
      <button class="f-btn" data-cat="esportes"><i data-lucide="trophy"></i> Esportes</button>
      <button class="f-btn" data-cat="saude"><i data-lucide="heart-pulse"></i> Saúde</button>
      <button class="f-btn" data-cat="estudo"><i data-lucide="code-2"></i> Estudos</button>
      <button class="f-btn" data-cat="hobby"><i data-lucide="gamepad-2"></i> Hobbies</button>
      <button class="f-btn" data-cat="lazer"><i data-lucide="sparkles"></i> Lazer</button>
    </nav>

    <!-- Matrix Cards Grid -->
    <main class="cards-grid" id="cardsGrid">
      <!-- Cards serão gerados via JS -->
    </main>
  </div>

  <!-- Modal Interativo -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-box" id="modalBox">
      <button class="modal-close-btn" id="closeModalBtn"><i data-lucide="x"></i></button>

      <div class="modal-top">
        <span class="modal-tag" id="mTag">CATEGORIA</span>
        <h2 class="modal-title" id="mTitle">Título do Bloco</h2>
        <div class="modal-time"><i data-lucide="clock"></i> <span id="mTime">00:00 - 00:00</span></div>
      </div>

      <div class="modal-content">
        <div class="m-section">
          <h4><i data-lucide="file-text"></i> Descrição Operacional</h4>
          <p id="mDesc">Descrição detalhada do bloco de rotina...</p>
        </div>

        <div class="m-section">
          <h4><i data-lucide="list-todo"></i> Meta-Checkpoints do Bloco</h4>
          <ul class="checklist-items" id="mChecklist">
            <!-- Items gerados dinamicamente -->
          </ul>
        </div>
      </div>

      <div class="modal-bottom">
        <button class="cyber-action-btn" id="completeBlockBtn">
          <i data-lucide="check-circle-2"></i> CONCLUIR BLOCO DE ROTINA
        </button>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    // Data Matrix - Personalizada
    const routineData = [
      {
        id: "block-1",
        title: "Triagem de Notas & Lançamentos",
        category: "trabalho",
        time: "08:00 - 10:00",
        shortDesc: "Recebimento, conferência de XMLs e alimentação do ERP na Coagru.",
        fullDesc: "Rotina essencial no departamento de Auxiliar Administrativo da Coagru. Envolve triagem minuciosa de notas fiscais, verificação de impostos, conferência de pedidos físicos com registros e inclusão dos dados no sistema central.",
        checklist: [
          "Verificar caixa de e-mails corporativos e chamados pendentes",
          "Conferir integridade dos XMLs e relatórios de frete",
          "Dar entrada nos lançamentos fiscais no sistema ERP",
          "Arquivar comprovantes nas pastas físicas e em nuvem"
        ],
        completed: false,
        color: "#00f0ff",
        icon: "file-spreadsheet"
      },
      {
        id: "block-2",
        title: "Atendimento & Malote Interno",
        category: "trabalho",
        time: "10:15 - 12:00",
        shortDesc: "Suporte aos setores da Coagru e despacho de documentos.",
        fullDesc: "Gestão do fluxo de informações entre os departamentos da Coagru. Suporte direto aos gestores com relatórios de insumos, atendimento aos cooperados e triagem de malotes.",
        checklist: [
          "Separar documentação para o malote do turno da tarde",
          "Atender solicitações internas de certidões e recibos",
          "Atualizar planilha de controle de fluxo de caixa diário"
        ],
        completed: false,
        color: "#00f0ff",
        icon: "building-2"
      },
      {
        id: "block-3",
        title: "Treino de Alta Intensidade",
        category: "esportes",
        time: "17:30 - 18:45",
        shortDesc: "Musculação focada em hipertrofia e corrida cardiorrespiratória.",
        fullDesc: "Sessão esportiva intensa para liberação de endorfina, manutenção do tônus muscular e melhora do fôlego para as partidas de futebol.",
        checklist: [
          "Aquecimento de mobilidade articular (10 min)",
          "Treino de força (Super-sets membros superiores e core)",
          "Corrida intervalada de 20 min na esteira/pista"
        ],
        completed: false,
        color: "#ff007f",
        icon: "dumbbell"
      },
      {
        id: "block-4",
        title: "Futebol Society / Rachão",
        category: "hobby",
        time: "19:30 - 21:00",
        shortDesc: "Partida rápida com amigos para treino tático e descontração.",
        fullDesc: "Hobby e esporte integrados. Momento de diversão, trabalho em equipe, explosão física e descompressão após a jornada de trabalho.",
        checklist: [
          "Preparar equipamento (chuteira, meião e hidratação)",
          "Realizar alongamento dinâmico pré-jogo",
          "Hidratação pós-partida com repositor eletrolítico"
        ],
        completed: false,
        color: "#ffb703",
        icon: "trophy"
      },
      {
        id: "block-5",
        title: "Refeição Regenerativa & Água",
        category: "saude",
        time: "12:15 - 13:30",
        shortDesc: "Alimentação balanceada e hidratação de 1.5L ao longo do dia.",
        fullDesc: "Foco na saúde física e na manutenção dos níveis de energia. Dieta rica em micronutrientes, vegetais e proteínas magras, combinada com acompanhamento metabólico.",
        checklist: [
          "Consumir 500ml de água logo ao acordar e manter garrafa na mesa",
          "Refeição equilibrada rica em vegetais e proteínas",
          "Pausa de 15 minutos de descanso longe de telas digitais"
        ],
        completed: false,
        color: "#00ff66",
        icon: "heart-pulse"
      },
      {
        id: "block-6",
        title: "Estudos de Automação & Excel",
        category: "estudo",
        time: "21:30 - 22:30",
        shortDesc: "Aprimoramento em Dashboards, VBA e gestão de dados.",
        fullDesc: "Foco no crescimento profissional dentro da área administrativa. Estudo prático focado em criar planilhas inteligentes e automatizar tarefas repetitivas.",
        checklist: [
          "Assistir 1 módulo de curso de Excel Avançado / Dashboards",
          "Aplicar fórmulas dinâmicas em exercícios práticos",
          "Anotar resumos no Notion"
        ],
        completed: false,
        color: "#7000ff",
        icon: "code-2"
      },
      {
        id: "block-7",
        title: "Desconexão & Leitura Noturna",
        category: "lazer",
        time: "22:45 - 23:30",
        shortDesc: "Hygge time: livro físico e desligamento de telas para o sono.",
        fullDesc: "Ritual para indução de sono reparador (REM). Redução da iluminação da casa, chá relaxante e leitura para desacelerar as ondas cerebrais.",
        checklist: [
          "Ativar modo Noturno total nos dispositivos eletrônicos",
          "Leitura de 15 páginas de desenvolvimento pessoal",
          "Organizar roupas e mochila para o dia seguinte"
        ],
        completed: false,
        color: "#ec4899",
        icon: "moon"
      }
    ];

    // Dynamic Sound Synthesizer via Web Audio API (Zero External Files)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 600, duration = 0.08, type = 'sine') {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSuccessChime() {
      setTimeout(() => playBeep(523.25, 0.1, 'triangle'), 0);
      setTimeout(() => playBeep(659.25, 0.1, 'triangle'), 100);
      setTimeout(() => playBeep(783.99, 0.2, 'triangle'), 200);
    }

    // Three.js 3D Interactive World
    let scene, camera, renderer;
    let shapes = [];
    let mouseX = 0, mouseY = 0;

    function init3D() {
      const canvas = document.getElementById('webgl-bg');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 30;

      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const pointLight1 = new THREE.PointLight(0x00f0ff, 2, 100);
      pointLight1.position.set(20, 20, 20);
      scene.add(pointLight1);

      const pointLight2 = new THREE.PointLight(0xff007f, 2, 100);
      pointLight2.position.set(-20, -20, -10);
      scene.add(pointLight2);

      // Geometric 3D Objects
      const geometries = [
        new THREE.TorusKnotGeometry(3, 0.8, 100, 16),
        new THREE.IcosahedronGeometry(3.5, 0),
        new THREE.OctahedronGeometry(4, 0),
        new THREE.TorusGeometry(4, 0.6, 16, 100),
        new THREE.BoxGeometry(3, 3, 3)
      ];

      const colors = [0x00f0ff, 0xff007f, 0x7000ff, 0x00ff66, 0xffb703];

      for (let i = 0; i < 18; i++) {
        const geom = geometries[Math.floor(Math.random() * geometries.length)];
        const mat = new THREE.MeshStandardMaterial({
          color: colors[Math.floor(Math.random() * colors.length)],
          wireframe: Math.random() > 0.4,
          roughness: 0.2,
          metalness: 0.8,
          transparent: true,
          opacity: 0.5 + Math.random() * 0.3
        });

        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.x = (Math.random() - 0.5) * 60;
        mesh.position.y = (Math.random() - 0.5) * 40;
        mesh.position.z = (Math.random() - 0.5) * 30;

        mesh.rotation.x = Math.random() * Math.PI;
        mesh.rotation.y = Math.random() * Math.PI;

        const scale = 0.5 + Math.random() * 1.2;
        mesh.scale.set(scale, scale, scale);

        mesh.userData = {
          rotSpeedX: (Math.random() - 0.5) * 0.015,
          rotSpeedY: (Math.random() - 0.5) * 0.015,
          floatSpeed: 0.005 + Math.random() * 0.01,
          initialY: mesh.position.y
        };

        shapes.push(mesh);
        scene.add(mesh);
      }

      window.addEventListener('resize', onWindowResize);
      document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      animate3D();
    }

    function animate3D() {
      requestAnimationFrame(animate3D);

      shapes.forEach((shape, index) => {
        shape.rotation.x += shape.userData.rotSpeedX;
        shape.rotation.y += shape.userData.rotSpeedY;
        shape.position.y = shape.userData.initialY + Math.sin(Date.now() * shape.userData.floatSpeed + index) * 2;
      });

      // Smooth camera parallax with mouse
      camera.position.x += (mouseX * 5 - camera.position.x) * 0.03;
      camera.position.y += (-mouseY * 5 - camera.position.y) * 0.03;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // DOM & State Management
    let currentActiveBlock = null;
    let selectedCategory = 'all';

    const cardsGrid = document.getElementById('cardsGrid');
    const filterBtns = document.querySelectorAll('.f-btn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalBox = document.getElementById('modalBox');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const completeBlockBtn = document.getElementById('completeBlockBtn');

    function renderCards() {
      cardsGrid.innerHTML = '';

      const filtered = selectedCategory === 'all' 
        ? routineData 
        : routineData.filter(d => d.category === selectedCategory);

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `matrix-card ${item.completed ? 'is-completed' : ''}`;
        card.style.setProperty('--card-accent', item.color);
        card.setAttribute('data-id', item.id);

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-header">
              <span class="card-tag" style="color: ${item.color}; border-color: ${item.color}44; background: ${item.color}15">
                <i data-lucide="${item.icon}"></i> ${item.category.toUpperCase()}
              </span>
              <span class="card-time"><i data-lucide="clock"></i> ${item.time}</span>
            </div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-desc">${item.shortDesc}</p>
            <div class="card-footer">
              <span class="card-status">
                ${item.completed ? '<i data-lucide="check-circle-2"></i> CONCLUÍDO' : '<i data-lucide="circle"></i> EM ABERTO'}
              </span>
              <span class="card-action">Detalhes <i data-lucide="arrow-right"></i></span>
            </div>
          </div>
        `;

        // 3D Tilt Card Interaction
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const rotateX = ((y - centerY) / centerY) * -12;
          const rotateY = ((x - centerX) / centerX) * 12;

          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(10px)`;
        });

        card.addEventListener('mouseleave', () => {
          card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)`;
        });

        card.addEventListener('click', () => {
          playBeep(800, 0.05);
          openModal(item);
        });

        cardsGrid.appendChild(card);
      });

      lucide.createIcons();
      updateDashboardStats();
    }

    function updateDashboardStats() {
      const total = routineData.length;
      const done = routineData.filter(d => d.completed).length;
      const percent = Math.round((done / total) * 100);

      document.getElementById('completedCount').textContent = `${done}/${total}`;
      document.getElementById('progressPercent').textContent = `${percent}%`;
    }

    // Modal Operations
    function openModal(data) {
      currentActiveBlock = data;

      document.getElementById('mTag').textContent = data.category.toUpperCase();
      document.getElementById('mTag').style.color = data.color;
      document.getElementById('mTag').style.borderColor = `${data.color}66`;
      document.getElementById('mTag').style.background = `${data.color}22`;

      document.getElementById('mTitle').textContent = data.title;
      document.getElementById('mTime').textContent = data.time;
      document.getElementById('mDesc').textContent = data.fullDesc;

      // Render Checklist
      const checklistContainer = document.getElementById('mChecklist');
      checklistContainer.innerHTML = '';
      
      data.checklist.forEach((task, idx) => {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
          <input type="checkbox" id="chk-${idx}" ${data.completed ? 'checked' : ''}>
          <label for="chk-${idx}">${task}</label>
        `;
        
        li.querySelector('input').addEventListener('change', () => {
          playBeep(450, 0.06);
        });

        checklistContainer.appendChild(li);
      });

      // Style Button if completed
      if (data.completed) {
        completeBlockBtn.innerHTML = `<i data-lucide="check-check"></i> BLOCO CONCLUÍDO (DESFAZER)`;
        completeBlockBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
      } else {
        completeBlockBtn.innerHTML = `<i data-lucide="check-circle-2"></i> CONCLUIR BLOCO DE ROTINA`;
        completeBlockBtn.style.background = 'linear-gradient(135deg, var(--cyber-pink), var(--cyber-purple))';
      }

      modalBackdrop.classList.add('active');
      lucide.createIcons();
    }

    function closeModal() {
      playBeep(300, 0.05);
      modalBackdrop.classList.remove('active');
    }

    // Complete Action Button
    completeBlockBtn.addEventListener('click', () => {
      if (!currentActiveBlock) return;

      currentActiveBlock.completed = !currentActiveBlock.completed;

      if (currentActiveBlock.completed) {
        playSuccessChime();
        // Fire celebration confetti
        confetti({
          particleCount: 90,
          spread: 70,
          origin: { y: 0.6 },
          colors: ['#00f0ff', '#ff007f', '#7000ff', '#00ff66']
        });
      } else {
        playBeep(250, 0.1);
      }

      renderCards();
      closeModal();
    });

    // Event Listeners
    closeModalBtn.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        playBeep(700, 0.04);
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCategory = btn.getAttribute('data-cat');
        renderCards();
      });
    });

    // Live Clock Update
    function updateClock() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').textContent = `${hrs}:${mins}:${secs}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Start 3D Engine & Render App
    init3D();
    renderCards();
  </script>
</body>
</html>
